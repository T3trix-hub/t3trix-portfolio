<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Проекты — T3trix</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="favicon-180.png" />
  <link rel="apple-touch-icon" href="favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <style>
    .page-hero {
      padding: 5rem 0 3rem;
      border-bottom: 1px solid var(--border);
    }

    .filter-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 2.5rem 0;
    }

    .filter-btn {
      padding: 0.4rem 1rem;
      border-radius: 99px;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      transition: var(--transition);
      font-family: var(--font-display);
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── FULL PROJECT CARDS ─────────────────── */
    .projects-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .project-row {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.25rem 1.5rem;
      align-items: start;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .project-row:hover {
      border-color: rgba(124,107,255,0.4);
      box-shadow: 0 8px 32px rgba(124,107,255,0.08);
    }

    .project-emoji { display: none; }

    .project-body {}

    .project-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .project-type { display: none; }

    .project-desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 1rem;
      max-width: 600px;
    }

    .project-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .project-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 130px;
    }

    .action-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-weight: 500;
      text-decoration: none;
      transition: var(--transition);
      white-space: nowrap;
    }

    .action-github {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .action-github:hover { border-color: var(--accent); color: var(--accent); }

    .action-live {
      background: var(--accent);
      color: #fff;
    }
    .action-live:hover { background: #9580ff; }

    .action-tg {
      background: #0088cc;
      color: #fff;
    }
    .action-tg:hover { background: #0099dd; }

    .action-icon {
      width: 14px; height: 14px;
      flex-shrink: 0;
    }

    .no-live {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      font-family: var(--font-mono);
      padding: 0.4rem;
    }

    @media (max-width: 700px) {
      .project-row { grid-template-columns: 1fr; }
      .project-actions {
        flex-direction: row;
        flex-wrap: wrap;
        min-width: unset;
      }
      .action-link { flex: 1; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">T3<span>trix</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Главная</a></li>
    <li><a href="projects.html">Проекты</a></li>
    <li><a href="about.html">Обо мне</a></li>
    <li><a href="contact.html">Контакты</a></li>
  </ul>
  <div class="nav-burger"><span></span><span></span><span></span></div>
</nav>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Все работы</span>
      <h1>Проекты</h1>
      <p id="projects-count" style="color:var(--muted);margin-top:0.75rem;max-width:480px;font-size:1.0625rem;line-height:1.7"></p>
      <div style="margin-top:1.5rem">
        <a href="contact.html" class="btn btn-primary">Связаться</a>
      </div>
    </div>
  </section>

  <section>
    <div class="container">

      <div class="filter-bar" id="filter-bar"></div>

      <div class="projects-list" id="projects-list"></div>
    </div>
  </section>
</main>

<footer>
  <p>© 2026 T3trix-hub / Алексей</p>
  <div style="display:flex;gap:1.25rem;">
    <a href="https://github.com/T3trix-hub" target="_blank">GitHub</a>
    <a href="contact.html">Контакты</a>
  </div>
</footer>

<script src="projects-data.js"></script>
<script src="portfolio.js"></script>
<script src="main.js"></script>
</body>
</html>
